appId: com.myfbox.desktop
productName: MyFBox
copyright: Copyright © MyFBox Contributors (AGPL-3.0-or-later)

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!landing/**'
  - '!vaults/**'
  - '!backups/**'

extraResources:
  - from: mcp
    to: mcp
    filter:
      - server.mjs

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Finance
  icon: build/icon.png
  maintainer: MyFBox Contributors

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.finance
  icon: build/icon.icns
