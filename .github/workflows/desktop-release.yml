name: Desktop Release (Win / macOS / Linux)

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: macos-15-intel
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Sync version from tag or release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          npm version "$TAG" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Lint and build
        run: npm run lint && npm run build && npm run electron:build

      - name: Package desktop installers
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: myfbox-${{ matrix.platform }}
          path: |
            release/*
            !release/*.yaml
            !release/*.yml
            !release/*.blockmap
            !release/builder-*
            !release/*-unpacked

  publish-release:
    needs: build-desktop
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && needs.build-desktop.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          path: dist-release
          merge-multiple: true

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist-release/*
