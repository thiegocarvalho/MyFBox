name: Sugestão de Melhoria / Feature Request
description: Propor uma nova funcionalidade ou melhoria de UX/arquitetura. / Propose a new feature or UX/architecture improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve? / What problem does this solve?
      description: Explique o caso de uso ou necessidade. / Explain the use case or need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução proposta / Proposed solution
      description: Como você imagina que isso deve funcionar, respeitando o modelo local-first/offline. / How you envision this working while respecting the local-first/offline model.
    validations:
      required: true
